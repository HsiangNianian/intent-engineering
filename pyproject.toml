[project]
name = "intent-engineering"
version = "0.1.0"
description = "Compile human goals, constraints, and evidence requirements into executable agent contracts"
readme = "README.md"
license = "MIT"
authors = [
    { name = "HsiangNianian", email = "i@jyunko.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
intent-engineering = "intent_engineering.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
